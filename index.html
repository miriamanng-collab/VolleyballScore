import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const c=window.FIREBASE_CONFIG;
if(!c||!c.projectId||String(c.projectId).startsWith('YOUR')){window._fbres(null)}else{
 const db=getFirestore(initializeApp(c));
 window._fbres({
  listen:(code,cb)=>onSnapshot(doc(db,'leagues',code),s=>{if(s.exists())cb(JSON.parse(s.data().json))},()=>{}),
  merge:(code,L)=>runTransaction(db,async tx=>{const r=doc(db,'leagues',code),s=await tx.get(r);let m=L;
   if(s.exists()){const d=JSON.parse(s.data().json),del=[...new Set([...(d.del||[]),...(L.del||[])])],seen=new Set();
    const all=[...(L.matches||[]),...(d.matches||[])].filter(x=>!del.includes(x.id)&&!seen.has(x.id)&&seen.add(x.id));
    const useL=(L.tu||0)>=(d.tu||0);m={matches:all,del,teams:useL?L.teams:d.teams,tu:Math.max(L.tu||0,d.tu||0)}}
   tx.set(r,{json:JSON.stringify(m),updated:Date.now()})})
 })}

 HIST.forEach(m=>[0,1].forEach(i=>{const k=m.teams[i].trim().toLowerCase();const r=T[k]||(T[k]={n:m.teams[i],P:0,W:0,L:0,sw:0,sl:0,pf:0,pa:0,pts:0});r.P++;r.pts+=mp(m)[i];mp(m)[i]>mp(m)[1-i]?r.W++:r.L++;r.sw+=m.sets[i];r.sl+=m.sets[1-i];r.pf+=sum(m,i);r.pa+=sum(m,1-i)}));

async function initCloud(){try{
 const u=await claude.use('user'),db=await claude.use('db');
 if(!u||!db){setSync('Saved on this device only (open while signed in to claude.ai to sync)');return}
 const id=await u.id();
 if(id){ref=db.collection('data/users/'+id).doc('volleyball');try{const s=await ref.get();if(s.exists)mergeRemote(s.data())}catch(e){}}
 DB=db;await connect();
}catch(e){setSync('Saved on this device only')}}
async function mkCode(){const o={m:HIST.map(m=>[m.id,m.teams,m.sets,m.res.flat(),m.wo?(m.pts[0]>m.pts[1]?1:2):0]),t:TEAMS.map(t=>[t.id,t.name,t.players]),d:DEL};
 let b=new TextEncoder().encode(JSON.stringify(o)),z=!!window.CompressionStream;
 if(z)b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
 let x='';b.forEach(c=>x+=String.fromCharCode(c));return (z?'z':'p')+btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function readCode(c){let b=Uint8Array.from(atob(c.slice(1).replace(/-/g,'+').replace(/_/g,'/')),x=>x.charCodeAt(0));
 if(c[0]=='z')b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
 const o=JSON.parse(new TextDecoder().decode(b));
 return {matches:o.m.map(a=>{const r=[];for(let i=0;i<a[3].length;i+=2)r.push([a[3][i],a[3][i+1]]);return {id:a[0],date:new Date(a[0]).toISOString(),teams:a[1],sets:a[2],res:r,wo:!!a[4],pts:a[4]==1?[3,0]:a[4]==2?[0,3]:[0,0]}}),teams:o.t.map(a=>({id:a[0],name:a[1],players:a[2]})),del:o.d||[]}}
async function showBackup(){const e=$('bk');e.style.display='block';e.value='Making code…';try{e.value=await mkCode()}catch(x){e.value='Could not make a code.'}e.focus();e.select()}
async function importBackup(){try{const d=await readCode($('imp').value.trim()),th=new Set(TEAMS.map(t=>t.id));d.teams.forEach(t=>{if(!th.has(t.id))TEAMS.push(t)});const n0=HIST.length;mergeRemote({matches:d.matches,del:d.del});TU=Date.now();saveHist();alert((HIST.length-n0)+' match(es) imported');render()}catch(e){alert('That backup code isn’t valid.')}}
let DB=null,unsub=null;
async function connect(){if(unsub){try{unsub()}catch(e){}unsub=null}sref=DB.collection('shared').doc(LC);
 try{const s=await sref.get();if(s.exists)mergeRemote(s.data())}catch(e){}
 saveHist();unsub=sref.onSnapshot(s=>{if(s.exists)mergeRemote(s.data())},()=>{})}
async function setLeague(c){LC=c;try{localStorage.setItem('vb-league-v1',c)}catch(e){}if(DB)await connect();render()}
async function joinLeague(){let c=$('imp').value.toUpperCase().replace(/[^A-Z0-9-]/g,'');if(c=='VOLLEYBALL')c='volleyball';if(c.length<4){alert('Enter a valid sync code.');return}if(c==LC){alert('This device is already on that league.');return}if(!confirm('Join league '+c+'? This device’s matches and teams will be merged into it.'))return;await setLeague(c)}
async function newLeague(){if(!confirm('Start a new league with a new sync code? This device’s current matches and teams carry over.'))return;const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='VB-';for(let i=0;i<8;i++)c+=a[Math.floor(Math.random()*a.length)];await setLeague(c)}
function snap(){H.push(JSON.stringify(S))}
function cur(t){const T=S.teams[t];return T.pl[T.i]}
function tgt(){return S.set==3?15:25}
function point(t){
 if(S.phase!='play')return;snap();
 S.sc[t]++;let msg=`${S.teams[t].name} win the rally → ${S.sc[0]}–${S.sc[1]}`;
 if(t!=S.srv){const L=S.teams[S.srv];L.i=(L.i+1)%L.pl.length;S.srv=t;msg+=` (side-out — ${cur(t)} serves)`}
 S.log.push(msg);
 if(S.set==3&&!S.sw&&Math.max(...S.sc)>=8){S.sw=true;S.log.push('Decider: switch sides now')}
 const a=S.sc[t],b=S.sc[1-t];
 if(a>=tgt()&&a-b>=2){S.sets[t]++;S.res.push([...S.sc]);S.log.push(`${S.teams[t].name} win Set ${S.set} ${S.sc[0]}–${S.sc[1]}`);S.phase=S.sets[t]==2?'done':'between';if(S.phase=='done')record()}
 save();render();
}
function undo(){if(!H.length)return;if(S.mid){rmMatch(S.mid);saveHist()}S=JSON.parse(H.pop());save();render()}
function nextSet(f){snap();S.set++;S.sc=[0,0];S.srv=f;S.first.push(f);S.sw=false;S.phase='play';S.log.push(`Set ${S.set} begins — ${S.teams[f].name} serve first (${cur(f)})`);save();render()}
function setServer(t,k){if(S.teams[t].i==k)return;snap();S.teams[t].i=k;S.log.push(`Server for ${S.teams[t].name} set to ${S.teams[t].pl[k]}`);save();render()}
function move(t,k,d){const T=S.teams[t],j=k+d;if(j<0||j>=T.pl.length)return;snap();[T.pl[k],T.pl[j]]=[T.pl[j],T.pl[k]];if(T.i==k)T.i=j;else if(T.i==j)T.i=k;S.log.push(`${T.name}: moved ${T.pl[j]} ${d<0?'up':'down'} in serving order`);save();render()}
function addPlayer(t){const T=S.teams[t],v=$('add'+t).value.trim();if(!v)return;snap();T.pl.push(v);S.log.push(`${T.name}: added ${v} to serving order`);save();render();$('add'+t).focus()}
let subT=null,drag=null;
function dragStart(e,t,k){e.preventDefault();drag={t,k,over:k};try{e.target.setPointerCapture(e.pointerId)}catch(x){}}
document.addEventListener('pointermove',e=>{if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest('.pl');document.querySelectorAll('.pl.ov').forEach(x=>x.classList.remove('ov'));if(r&&r.dataset.t==drag.t){drag.over=+r.dataset.k;r.classList.add('ov')}});
function dragEnd(){if(!drag)return;const d=drag;drag=null;if(d.over!=d.k)reorder(d.t,d.k,d.over);else render()}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
function reorder(t,from,to){const T=S.teams[t];snap();const n=T.pl[from];T.pl.splice(from,1);T.pl.splice(to,0,n);
 if(T.i==from)T.i=to;else if(from<T.i&&to>=T.i)T.i--;else if(from>T.i&&to<=T.i)T.i++;
 S.log.push(`${T.name}: moved ${n} to position ${to+1} in serving order`);save();render()}
function subUI(t){subT=t;render()}
function subForm(t){const T=S.teams[t];return `<div class="card" style="margin:8px 0;padding:8px"><div class="mut">Player going out</div><select id="so">${T.pl.map((n,k)=>`<option value="${k}" ${k==T.i?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="mut">Player coming in</div><input id="si" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();doSub(${t})}" list="bl${t}" placeholder="New or bench player"><datalist id="bl${t}">${(T.bench||[]).map(b=>`<option value="${esc(b)}">`).join('')}</datalist><div class="row"><button class="pri" onclick="doSub(${t})">Confirm</button><button onclick="subT=null;render()">Cancel</button></div></div>`}
function doSub(t){const T=S.teams[t],k=+$('so').value,nn=$('si').value.trim();if(!nn)return;if(T.pl.some(p=>p.toLowerCase()==nn.toLowerCase())){alert(nn+' is already in the serving order.');return}
 snap();const out=T.pl[k];T.pl[k]=nn;T.bench=(T.bench||[]).filter(x=>x.toLowerCase()!=nn.toLowerCase());T.bench.push(out);
 S.log.push(`Substitution (${T.name}): ${out} out, ${nn} in at ${S.sc[0]}–${S.sc[1]}`);subT=null;save();render()}
function walkover(t){if(!confirm(S.teams[t].name+' receive the walkover (3 points)?'))return;snap();S.wo=t;S.phase='done';record();S.log.push(`Walkover awarded to ${S.teams[t].name}`);save();render()}
function reset(){if(confirm(S&&S.mid?'Delete this match? It will also be removed from your history.':'Delete this match? It won’t be saved to your history.')){if(S&&S.mid){rmMatch(S.mid);saveHist()}S=null;H=[];view='home';save();render()}}
function pts(){
 if(S.wo!=null)return S.wo==0?[3,0]:[0,3];
 const w=S.sets[0]==2?0:1,l=1-w,r=[0,0];r[w]=S.sets[l]==0?3:2;return r;
}
function side(t){
 const T=S.teams[t],on=S.srv==t&&S.phase=='play',nx=(T.i+1)%T.pl.length;
 return `<div class="card"><div class="nm" style="color:var(--${t?'b':'a'})">${esc(T.name)}</div>
 <div class="srvbox ${on?'':'idle'}">${on?'🏐 '+esc(cur(t))+' serving':'Next to serve: '+esc(T.pl[nx==T.i?T.i:(S.srv==t?nx:T.i)])}</div>
 <div class="mut" style="margin-bottom:4px">Serving order — drag ≡ to reorder, tap a name to change the server</div>
 <div class="ord">${T.pl.map((n,k)=>`<div class="pl ${k==T.i?'cur':''}" data-t="${t}" data-k="${k}" onclick="setServer(${t},${k})"><span><span class="hd" title="Drag to reorder" onpointerdown="dragStart(event,${t},${k})" onclick="event.stopPropagation()">≡</span> ${k+1}. ${esc(n)}</span><span>${S.phase=='between'?`<button style="padding:1px 9px" onclick="event.stopPropagation();move(${t},${k},-1)">↑</button> <button style="padding:1px 9px" onclick="event.stopPropagation();move(${t},${k},1)">↓</button>`:(k==T.i?(on?'serving':'up next'):'<span class="mut">set as server</span>')}</span></div>`).join('')}</div>${S.phase=='between'?`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="add${t}" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();addPlayer(${t})}" placeholder="Add player" style="margin:0"><button onclick="addPlayer(${t})">Add</button></div>`:''}${subT==t?subForm(t):`<div class="row" style="margin-top:8px"><button onclick="subUI(${t})">🔄 Substitution</button></div>`}${(T.bench||[]).length?`<div class="mut" style="margin-top:6px">Bench: ${T.bench.map(esc).join(', ')}</div>`:''}</div>`;
}
function render(){
 if(view=='home'){home();return}if(view=='teams'){teamsView();return}if(!S){setup();return}
 const [A,B]=S.teams,ph=S.phase;
 let h=`<div class="card">${ph=='play'?`<div class="srvbox" style="margin-top:0">🏐 ${esc(cur(S.srv))} serving <span class="mut">· ${esc(S.teams[S.srv].name)}</span></div>`:''}<div class="sb"><div><div class="nm" style="color:var(--a)">${esc(A.name)}${S.srv==0&&ph=='play'?'<span class="sv">serve</span>':''}</div><div class="sc">${S.sc[0]}</div><div class="mut">Sets ${S.sets[0]}</div></div>
 <div class="mut">Set ${S.set}<br>to ${tgt()}<br>win by 2</div>
 <div><div class="nm" style="color:var(--b)">${esc(B.name)}${S.srv==1&&ph=='play'?'<span class="sv">serve</span>':''}</div><div class="sc">${S.sc[1]}</div><div class="mut">Sets ${S.sets[1]}</div></div></div>
 ${S.res.length?`<div class="mut" style="text-align:center;margin-top:6px">Completed: ${S.res.map((r,i)=>`S${i+1} ${r[0]}–${r[1]}`).join(' · ')}</div>`:''}</div>`;
 if(S.sw&&ph=='play')h+=`<div class="warn">🔁 Decider: teams switch sides at 8 points.</div>`;
 if(ph=='play'&&S.sc[0]>=tgt()-1&&S.sc[1]>=tgt()-1)h+=`<div class="warn">Late-set tie — play continues, no cap, until a 2-point lead.</div>`;
 if(ph=='play')h+=`<div class="row"><button class="big ta" onclick="point(0)">+ Point ${esc(A.name)}</button><button class="big tb" onclick="point(1)">+ Point ${esc(B.name)}</button></div>
 <div class="row" style="margin:10px 0"><button onclick="undo()">↩ Undo</button><button onclick="walkover(0)">Walkover → ${esc(A.name)}</button><button onclick="walkover(1)">Walkover → ${esc(B.name)}</button></div>`;
 if(ph=='between'){const d=S.set==1?1-S.first[0]:null;
  h+=`<div class="card"><b>Set ${S.set} finished.</b> Who serves first in Set ${S.set+1}?<div class="mut">${S.set==1?'Standard: the team that received first in Set 1 serves first in Set 2.':'Decider — hold a new coin toss.'} Edit the serving order below: reorder with ↑ ↓ or add players (names can’t be removed). Tap a name to choose who serves first.</div>
  <div class="row" style="margin-top:8px"><button class="${d==0?'pri':''}" onclick="nextSet(0)">${esc(A.name)} serve</button><button class="${d==1?'pri':''}" onclick="nextSet(1)">${esc(B.name)} serve</button><button onclick="undo()">↩ Undo last point</button></div></div>`}
 if(ph=='done'){const p=pts(),w=p[0]>p[1]?0:1;
  h+=`<div class="card"><div class="ok">🏆 ${esc(S.teams[w].name)} win${S.wo!=null?' by walkover':` ${S.sets[w]}–${S.sets[1-w]}`}</div>
  <p>League points: <b>${esc(A.name)} ${p[0]}</b> · <b>${esc(B.name)} ${p[1]}</b></p>
  <div class="row"><button onclick="undo()">↩ Undo</button><button class="pri" onclick="newMatch(true)">New match</button><button onclick="goHome()">← Home</button></div></div>`}
 h+=`<div class="g2">${side(0)}${side(1)}</div>
 <div class="card"><b>Match log</b><ul>${S.log.slice(-10).reverse().map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>
 <div class="row"><button onclick="goHome()">← Home</button><button onclick="reset()">🗑 Delete match</button></div>
 <p class="mut">Points table: 2–0 win = 3 · 2–1 win = 2 · loss = 0 · walkover = 3.</p>`;
 $('app').innerHTML=h;
}
let FB=null;
function saveHist(){persist();if(!FB||!LC)return;setSync('☁ Syncing…');FB.merge(LC,{matches:HIST,teams:TEAMS,del:DEL,tu:TU}).then(()=>setSync('☁ Synced · league '+LC.toUpperCase())).catch(()=>setSync('⚠ Sync failed — saved on this device'))}
async function connect(){if(unsub){try{unsub()}catch(e){}unsub=null}if(!FB||!LC)return;saveHist();unsub=FB.listen(LC,mergeRemote)}
async function setLeague(c){LC=c;try{localStorage.setItem('vb-league-v1',c)}catch(e){}await connect();render()}
async function initCloud(){FB=await window.fbReady;if(!FB){setSync('Local only — add your Firebase config to enable sync (see README)');return}
 if(!LC){setSync('Local only — start or join a league below to sync');return}await connect()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();initCloud();
</script></body></html>
